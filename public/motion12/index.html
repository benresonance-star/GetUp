<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MOTION 12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>MOTION 12 — 12-week fitness reset</title>
  <script>
    (function(){
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (standalone) document.documentElement.classList.add('standalone');
    })();
  </script>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div><div class="brand">MOTION<i>12</i></div><div class="date" id="todayDate"></div></div>
      <div class="top-actions">
        <button class="home-mode-toggle" id="homeModeToggle" type="button" role="switch" aria-checked="false" aria-label="Use compact Home">
          <span class="home-mode-label">Compact</span><span class="switch-track"><span class="switch-knob"></span></span>
        </button>
        <button class="gear" id="settingsBtn" type="button" aria-label="Open settings"><span class="gear-icon">⚙</span><span class="gear-label">Settings</span></button>
      </div>
    </div>
  </header>
  <main>
    <section id="homePage" class="page active"></section>
    <section id="daysPage" class="page"></section>
    <section id="dayPage" class="page"></section>
    <section id="progressPage" class="page"></section>
  </main>
  <nav class="bottomnav">
    <button class="navbtn active" data-page="homePage"><strong>⌂</strong>Home</button>
    <button class="navbtn" data-page="daysPage"><strong>▦</strong>Days</button>
    <button class="navbtn" data-page="progressPage"><strong>↗</strong>Progress</button>
    <button class="navbtn" id="quickTimer"><strong>◷</strong>Timer</button>
  </nav>
</div>
<div class="settings-overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>Program settings</h2>
    <div class="field"><label>12-week start date (Monday)</label><input type="date" id="startDateInput"></div>
    <div class="field"><label>Bodyweight (kg)</label><input type="number" id="bodyweightInput" step="0.1" min="30" max="250"></div>
    <div class="settings-grid">
      <div class="field"><label>Height (cm)</label><input type="number" id="heightInput" step="1" min="120" max="230"></div>
      <div class="field"><label>Age</label><input type="number" id="ageInput" step="1" min="18" max="100"></div>
    </div>
    <div class="field"><label>Sex for calorie estimate</label><select id="sexInput"><option value="">Choose</option><option value="male">Male</option><option value="female">Female</option></select></div>
    <div class="field"><label>Daily step baseline</label><input type="number" id="stepsInput" step="500" min="0"></div>
    <div class="field"><label>Known maintenance calories — optional</label><input type="number" id="maintenanceInput" step="50" min="1200" max="6000" placeholder="Overrides estimate if known"></div>
    <details class="portion-settings">
      <summary>Portion calibration</summary>
      <p class="settings-note">Edit these once to match your usual portions. Calories/macros recalculate from representative food values.</p>
      <div class="settings-grid">
        <div class="field"><label>Greek yoghurt (g)</label><input type="number" id="yogurtInput" step="10" min="0"></div>
        <div class="field"><label>Berries (g)</label><input type="number" id="berriesInput" step="10" min="0"></div>
        <div class="field"><label>Nuts (g)</label><input type="number" id="nutsInput" step="5" min="0"></div>
        <div class="field"><label>Latte milk each (ml)</label><input type="number" id="latteMilkInput" step="10" min="0"></div>
        <div class="field"><label>Cooked meat/fish (g)</label><input type="number" id="meatInput" step="10" min="0"></div>
        <div class="field"><label>Lunch cooked rice (g)</label><input type="number" id="lunchRiceInput" step="10" min="0"></div>
        <div class="field"><label>Dinner cooked rice (g)</label><input type="number" id="dinnerRiceInput" step="10" min="0"></div>
        <div class="field"><label>Vegetables each meal (g)</label><input type="number" id="vegInput" step="10" min="0"></div>
        <div class="field"><label>Oil/fat each meal (g)</label><input type="number" id="oilInput" step="1" min="0"></div>
        <div class="field"><label>Protein powder (g)</label><input type="number" id="powderInput" step="5" min="0"></div>
        <div class="field"><label>Shake milk (ml)</label><input type="number" id="shakeMilkInput" step="10" min="0"></div>
      </div>
    </details>
    <div class="sheet-actions"><button class="cancel" id="cancelSettings">Cancel</button><button class="save" id="saveSettings">Save</button></div>
  </div>
</div>
<script src="program.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
</body>
</html>
