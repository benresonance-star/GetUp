    .page{display:none}.page.active{display:block}.page-title{padding:10px 2px 2px}.page-title h1{font-size:42px;line-height:.95;text-transform:uppercase;letter-spacing:-.06em;margin:10px 0}.page-title p{color:var(--muted);line-height:1.5;margin:0}.back{border:0;background:none;color:var(--muted);padding:0;font-weight:850;cursor:pointer}

    .complete-session{width:100%;border:0;background:var(--volt);color:#0a0b0c;padding:16px;border-radius:18px;font-size:15px;font-weight:950;margin:10px 0;cursor:pointer}.complete-session.done{background:var(--cyan)}
    .day-list .card{cursor:pointer}.day-list .label{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.08em}.day-list h3{font-size:24px;letter-spacing:-.05em;text-transform:uppercase;margin:5px 0}.day-list .right{font-size:24px}.day-list .todaycard{border-color:var(--volt);box-shadow:0 0 0 1px rgba(255,77,46,.15) inset}
    .measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.measure input{margin-top:10px;width:100%;background:#101215;border:1px solid var(--line);color:white;border-radius:12px;padding:11px}.savebar{position:sticky;bottom:82px;background:rgba(13,14,16,.93);padding:10px 0;backdrop-filter:blur(12px)}
    .settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:100}.settings-overlay.show{display:flex}.sheet{width:min(520px,100%);margin:auto;background:#17191d;border-radius:30px 30px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheet h2{margin:0 0 16px}.sheet .field{margin:12px 0}.sheet input{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#0f1113;color:white}.sheet-actions{display:flex;gap:8px;margin-top:18px}.sheet-actions button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.save{background:var(--volt);color:#0b0c0e}.cancel{background:#272a30;color:white}
    .fast{color:var(--orange)}.cyan{color:var(--cyan)}.volt{color:var(--volt)}.pink{color:var(--pink)}
    @media(min-width:760px){body{background:#070809}.app{max-width:900px}.bottomnav{max-width:900px}.homegrid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.homegrid .section{margin-top:18px}.hero{min-height:330px}.hero h1{font-size:62px}.day-page-wrap{display:grid;grid-template-columns:340px 1fr;gap:20px}.day-page-wrap .sticky-col{position:sticky;top:92px;height:max-content}.exercise{padding:19px}.settings-overlay{align-items:center}.sheet{border-radius:30px;max-width:520px}}

.video-link{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:5px 8px;border:1px solid rgba(255,77,46,.35);border-radius:999px;color:var(--volt);font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;vertical-align:2px;white-space:nowrap}.video-link:hover{background:rgba(255,77,46,.10)}.nutrition-strip{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;color:#c8cbd0}.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.target-chip{border:1px solid var(--line);border-radius:14px;padding:10px;background:#101215}.target-chip b{display:block;color:var(--volt);font-size:16px}.target-chip span{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:850;letter-spacing:.06em}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#0f1113;color:white}
.meal-list{margin-top:10px;display:grid;gap:8px}
.meal-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.meal-name{display:block;font-weight:950;font-size:15px;margin-bottom:5px}
.meal-row p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.meal-numbers{display:grid;grid-template-columns:auto auto;gap:2px 5px;align-items:baseline;text-align:right;white-space:nowrap}
.meal-numbers b{font-size:15px;color:var(--volt)}
.meal-numbers span{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:850;letter-spacing:.05em}
.meal-note{font-size:11px;color:var(--muted);line-height:1.5;padding:6px 4px 0}
.fast-card{border-color:rgba(255,77,46,.3);background:linear-gradient(135deg,rgba(255,77,46,.08),var(--surface) 45%)}
@media(max-width:390px){.meal-row{grid-template-columns:1fr}.meal-numbers{text-align:left;width:max-content}.settings-grid{grid-template-columns:1fr}}

/* iPhone header + settings usability */
.top{
  padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
  background:linear-gradient(to bottom,rgba(13,14,16,.98) 72%,rgba(13,14,16,.82) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
}
.topline{min-height:52px;align-items:center}
.brand{font-size:25px;line-height:1}
.date{
  margin-top:7px;
  color:#e4e5e7;
  opacity:1;
  font-size:13px;
  line-height:1.2;
  letter-spacing:.10em;
  font-weight:900;
}
.gear{
  width:auto;
  min-width:52px;
  height:46px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid #3a3d43;
  background:#191b1f;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  position:relative;
  z-index:30;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.gear-icon{font-size:18px;line-height:1}
.gear-label{font-size:12px;font-weight:900;letter-spacing:.02em}
.settings-overlay{
  z-index:300;
  padding-top:env(safe-area-inset-top, 0px);
  pointer-events:none;
}
.settings-overlay.show{display:flex;pointer-events:auto}
.sheet{
  position:relative;
  max-height:calc(100dvh - env(safe-area-inset-top, 0px) - 12px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(26px + env(safe-area-inset-bottom, 0px));
}
.sheet .field label{
  font-size:11px;
  margin-bottom:7px;
}
.sheet input,
.sheet select{
  min-height:50px;
  font-size:16px;
  line-height:1.2;
  touch-action:manipulation;
}
.sheet select{
  -webkit-appearance:auto;
  appearance:auto;
}
.sheet-actions{
  position:sticky;
  bottom:calc(-1 * env(safe-area-inset-bottom, 0px));
  background:linear-gradient(to top,#17191d 78%,rgba(23,25,29,0));
  padding-top:16px;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  z-index:4;
}
.sheet-actions button{
  min-height:50px;
  font-size:15px;
  touch-action:manipulation;
}
@media(max-width:520px){
  .app{padding-top:0}
  main{padding-top:8px}
  .settings-overlay{align-items:flex-end}
  .sheet{border-radius:28px 28px 0 0}
}
@media(max-width:360px){
  .gear-label{display:none}
  .gear{width:46px;min-width:46px;padding:0}
}

/* iPhone: keep the app header pinned through scroll and cold relaunch. */
@media(max-width:520px){
  .top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    max-width:520px;
    margin:0 auto;
    transform:none;
    z-index:250;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
    background:#0d0e10;
    border-bottom:1px solid rgba(255,255,255,.05);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    contain:paint;
  }
  main{
    padding-top:calc(env(safe-area-inset-top, 0px) + 92px);
  }
  html,body{
    scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 92px);
  }
}
/* Explicit standalone rule as a second path for iOS Home Screen apps. */
@media(display-mode:standalone){
  .top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    margin:0 auto;
    transform:none;
    padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
    background:#0d0e10;
  }
  main{
    padding-top:calc(env(safe-area-inset-top, 0px) + 96px);
  }
}
html.standalone .top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  margin:0 auto;
  transform:none;
  padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
  background:#0d0e10;
}
html.standalone main{
  padding-top:calc(env(safe-area-inset-top, 0px) + 96px);
}

.mobility-home-card{width:100%;text-align:left;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}.mobility-home-card .right{font-size:22px;color:var(--volt)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div><div class="brand">MOTION<i>12</i></div><div class="date" id="todayDate"></div></div>
      <button class="gear" id="settingsBtn" type="button" aria-label="Open settings"><span class="gear-icon">⚙</span><span class="gear-label">Settings</span></button>
    </div>
  </header>
  <main>
    <section id="homePage" class="page active"></section>
    <section id="daysPage" class="page"></section>
    <section id="dayPage" class="page"></section>
    <section id="progressPage" class="page"></section>
  </main>
  <nav class="bottomnav">
    <button class="navbtn active" data-page="homePage"><strong>⌂</strong>Home</button>
    <button class="navbtn" data-page="daysPage"><strong>▦</strong>Days</button>
    <button class="navbtn" data-page="progressPage"><strong>↗</strong>Progress</button>
    <button class="navbtn" id="quickTimer"><strong>◷</strong>Timer</button>
  </nav>
</div>
<div class="settings-overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>Program settings</h2>
    <div class="field"><label>12-week start date (Monday)</label><input type="date" id="startDateInput"></div>
    <div class="field"><label>Bodyweight (kg)</label><input type="number" id="bodyweightInput" step="0.1" min="30" max="250"></div>
    <div class="settings-grid">
      <div class="field"><label>Height (cm)</label><input type="number" id="heightInput" step="1" min="120" max="230"></div>
      <div class="field"><label>Age</label><input type="number" id="ageInput" step="1" min="18" max="100"></div>
    </div>
    <div class="field"><label>Sex for calorie estimate</label><select id="sexInput"><option value="">Choose</option><option value="male">Male</option><option value="female">Female</option></select></div>
    <div class="field"><label>Daily step baseline</label><input type="number" id="stepsInput" step="500" min="0"></div>
    <div class="field"><label>Known maintenance calories — optional</label><input type="number" id="maintenanceInput" step="50" min="1200" max="6000" placeholder="Overrides estimate if known"></div>
    <div class="sheet-actions"><button class="cancel" id="cancelSettings">Cancel</button><button class="save" id="saveSettings">Save</button></div>
  </div>
</div>
<script>const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  1:{name:'Strength A',why:'Your highest-quality strength session before the fast begins.',time:'30 min',tone:'volt',diet:'Fast starts after training',work:[

<script>const defaultSettings={startDate:getMondayISO(new Date()),bodyweight:0,height:0,age:0,sex:'',steps:7000,maintenanceOverride:0};
const storedSettings=JSON.parse(localStorage.getItem('motion12.settings')||'null')||{};
let settings={...defaultSettings,...storedSettings};
let logs=JSON.parse(localStorage.getItem('motion12.logs')||'{}');
let measurements=JSON.parse(localStorage.getItem('motion12.measurements')||'{}');
let timerInt=null,timerSeconds=0,timerRunning=false;
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getMondayISO(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return iso(x)}
function todayISO(){const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekNo(){const s=new Date(settings.startDate+'T00:00:00');const t=new Date(todayISO()+'T00:00:00');return Math.max(1,Math.min(12,Math.floor((t-s)/604800000)+1))}
function programDay(){return new Date().getDay()}
function sessionKey(day=programDay()){return `${todayISO()}-${day}`}
function protein(){return settings.bodyweight>0?Math.round(settings.bodyweight*1.8):null}
function round5(n){return Math.round(n/5)*5}
function round50(n){return Math.round(n/50)*50}
function proteinSplit(){
  const p=protein(); if(!p)return null;
  const shake=round5(Math.min(40,Math.max(30,p*.22)));
  const mealProtein=p-shake;
  const breakfast=round5(mealProtein/3);
  const lunch=round5((mealProtein-breakfast)/2);
  const dinner=Math.max(0,p-shake-breakfast-lunch);
  return {breakfast,lunch,dinner,shake,total:p};
}
function weeklyProteinAverage(){const p=protein();return p?Math.round((p*6)/7):null}
function fatLossTargets(){if(!settings.bodyweight)return null;return {low:(settings.bodyweight*.005).toFixed(2),high:(settings.bodyweight*.008).toFixed(2),mid:settings.bodyweight*.0065,cap:(settings.bodyweight*.01).toFixed(2)}}
function activityFactor(){
  const st=Number(settings.steps)||0;
  if(st<4000)return 1.35;
  if(st<7000)return 1.45;
  if(st<10000)return 1.55;
  return 1.65;
}
function maintenanceEstimate(){
  if(Number(settings.maintenanceOverride)>0)return {kcal:round50(Number(settings.maintenanceOverride)),basis:'manual maintenance'};
  const w=Number(settings.bodyweight),h=Number(settings.height),a=Number(settings.age),sex=settings.sex;
  if(w>0&&h>0&&a>0&&(sex==='male'||sex==='female')){
    const rmr=10*w+6.25*h-5*a+(sex==='male'?5:-161);
    return {kcal:round50(rmr*activityFactor()),basis:'Mifflin–St Jeor estimate'};
  }
  if(w>0)return {kcal:round50(w*30),basis:'rough bodyweight estimate'};
  return null;
}
function calorieTargets(){
  const m=maintenanceEstimate(),f=fatLossTargets(),w=Number(settings.bodyweight);
  if(!m||!f||!w)return null;
  const weeklyMaintenance=m.kcal*7;
  const targetWeeklyDeficit=f.mid*7700;
  const rawEatingDay=(weeklyMaintenance-targetWeeklyDeficit)/6;
  const eatingDay=round50(Math.max(1200,rawEatingDay));
  const weeklyIntake=eatingDay*6;
  const actualWeeklyDeficit=weeklyMaintenance-weeklyIntake;
  const predictedLoss=Math.max(0,actualWeeklyDeficit/7700);
  const predictedPct=(predictedLoss/w)*100;
  return {
    maintenance:m.kcal,basis:m.basis,eatingDay,fastDay:0,
    targetWeeklyDeficit:Math.round(targetWeeklyDeficit),
    actualWeeklyDeficit:Math.round(actualWeeklyDeficit),
    weeklyIntake,
    predictedLoss:Number(predictedLoss.toFixed(2)),
    predictedPct:Number(predictedPct.toFixed(2)),
    constrained:rawEatingDay<1200
  };
}
function mealPlan(day){
  const c=calorieTargets(),ps=proteinSplit();
  if(!c||!ps)return null;
  if(day===1)return {total:0,meals:[],note:'Fast after the morning workout. Water, plain tea/coffee; resume meals Tuesday.'};
  const total=c.eatingDay;
  const shake=150;
  const breakfast=round50(total*.25);
  const lunch=round50((total-breakfast-shake)/2);
  const dinner=total-breakfast-lunch-shake;
  return {total,meals:[
    {name:'Breakfast',kcal:breakfast,protein:ps.breakfast,portion:'High-protein Greek yoghurt · 1 fist berries · 1–2 thumbs nuts. Adjust yoghurt/nuts to hit the meal calories.'},
    {name:'Lunch',kcal:lunch,protein:ps.lunch,portion:'1½–2 palms lean meat/fish · 1–1½ cupped hands cooked rice · 2 fists vegetables · 1 thumb fat'},
    {name:'Dinner',kcal:dinner,protein:ps.dinner,portion:'1½–2 palms lean meat/fish · 1–1½ cupped hands cooked rice · 2 fists vegetables · 1 thumb fat'},
    {name:'Protein shake',kcal:shake,protein:ps.shake,portion:'Protein powder + water, targeting ~150 kcal. Check your powder label; add milk/fruit only by borrowing calories from meals.'}
  ],note:'Keep protein portions stable. Adjust rice and added fats first when calories need moving.'};
}
function nutritionSummary(day=programDay()){
  const p=protein(),f=fatLossTargets(),c=calorieTargets(),m=mealPlan(day);
  if(!p||!f)return 'Add bodyweight to calculate protein and weekly fat-loss targets.';
  if(!c)return 'Protein ~'+p+' g/day · target loss '+f.low+'–'+f.high+' kg/week. Add height, age and sex for a better calorie estimate.';
  if(day===1)return 'Monday fast · 0 kcal assumption · estimated maintenance ~'+c.maintenance+' kcal · planned loss ~'+c.predictedLoss+' kg/week.';
  return '~'+m.total+' kcal today · protein ~'+p+' g · planned loss ~'+c.predictedLoss+' kg/week ('+c.predictedPct+'% bodyweight) · target range '+f.low+'–'+f.high+' kg/week.';
}
function dietText(day){
  const p=protein(),ps=proteinSplit(),c=calorieTargets();
  if(day===1)return ['FAST DAY','Morning workout → fast',c?'0 kcal after the workout today; eating-day target resumes Tuesday at ~'+c.eatingDay+' kcal.':'Water, plain tea/coffee. Add bodyweight for targets.'];
  if(day===2)return ['REFEED',c?'~'+c.eatingDay+' kcal today':'Break fast after recovery',p?'3 whole-food meals + shake · ~'+p+' g protein total.':'Protein-rich first meal.'];
  return p?[c?'~'+c.eatingDay+' KCAL':'~'+p+' G PROTEIN','3 whole-food meals + protein shake',ps?'Protein: ~'+ps.breakfast+' g breakfast · '+ps.lunch+' g lunch · '+ps.dinner+' g dinner · '+ps.shake+' g shake.':'Protein + plants.']:['SET WEIGHT','3 meals + shake','Add bodyweight in settings to calculate targets.'];
}
function formatDate(){const d=new Date();const weekday=new Intl.DateTimeFormat('en-AU',{weekday:'long'}).format(d).toUpperCase();const rest=new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short'}).format(d).toUpperCase();return weekday+' · '+rest}
function weeklyTarget(day,w){if(day===4)return swingTargets[w-1];if(day===6)return aerobicTargets[w-1];if(w===8)return 'DELOAD — reduce sets 35–40%';if(w===12)return 'CONSOLIDATE — reduce volume ~40%';if(w>=9)return '1–2 reps in reserve on final sets';if(w>=5)return '~2 reps in reserve';return w<=2?'~3 reps in reserve':'~2–3 reps in reserve'}
function completedOn(date,day){return !!logs[`${date}-${day}`]?.completed}
</script>

function openDay(day,date=null){date=date||dateForProgramDay(day);const w=weekNo(),p=program[day];showPage('dayPage');let exHtml='';p.work.forEach((x,i)=>{const id=exId(day,i,date);const state=logs[id]||{};let target=x[1];if(day===4)target=swingTargets[w-1];if(day===6)target=aerobicTargets[w-1];exHtml+=`<div class="exercise ${state.done?'complete':''}" id="ex-${id}"><div class="ex-top"><div class="num">${i+1}</div><div class="ex-name"><h3>${x[0]} ${videoButtons(x[0])}</h3><p>${target}</p></div><button class="check" onclick="toggleExercise('${id}')"></button></div>

  document.getElementById('progressPage').innerHTML=`<div class="page-title"><div class="eyebrow">Functional age dashboard</div><h1>Progress</h1><p>Track six useful measures. Calories are an estimate; the weight trend tells us whether the estimate is right.</p></div><section class="section"><div class="card accent"><span class="tag">Nutrition targets</span><div class="target-grid"><div class="target-chip"><b>${p?`${p} g`:'Set weight'}</b><span>protein / eating day</span></div><div class="target-chip"><b>${cal?`${cal.eatingDay} kcal`:'Set details'}</b><span>eating-day target</span></div><div class="target-chip"><b>${cal?`${cal.predictedLoss} kg`:'—'}</b><span>planned loss / week</span></div><div class="target-chip"><b>${cal?`${cal.maintenance} kcal`:'—'}</b><span>estimated maintenance</span></div></div>${cal?`<div class="nutrition-strip">Target range ${fat.low}–${fat.high} kg/week · planned deficit ${cal.actualWeeklyDeficit} kcal/week · weekly intake ${cal.weeklyIntake} kcal. This math assumes Monday is truly 0 kcal.</div>`:''}</div><div class="measure-grid" style="margin-top:10px">${cards}</div><div class="savebar"><button class="complete-session" onclick="saveMeasurements()">Save measures</button></div></section><section class="section"><div class="card accent"><h3>Calorie adjustment rule</h3><p>${fat&&cal?`Use morning weights and compare 7-day averages across two full weeks. Only adjust if adherence was good. If loss is below ~${fat.low} kg/week for both weeks, remove ~100–150 kcal from eating days. If loss is above ~${fat.cap} kg/week, or strength/sleep/energy fall, add ~100–150 kcal. Keep protein steady; adjust rice and fats first.`:'Enter bodyweight to calculate the adjustment range.'}</p></div><div class="card" style="margin-top:10px"><h3>What success looks like</h3><p>Waist ↓ · strength maintained or ↑ · 2 km time ↓ · cardiovascular tolerance ↑ · blood pressure healthy · resting heart rate stable or ↓.</p></div></section>`;
}
function saveMeasurements(){['weight','waist','bp','rhr','walk','pushups'].forEach(id=>measurements[id]=document.getElementById('measure-'+id).value);const w=Number(measurements.weight);if(w>0){settings.bodyweight=w;localStorage.setItem('motion12.settings',JSON.stringify(settings))}localStorage.setItem('motion12.measurements',JSON.stringify(measurements));renderHome();renderDays();renderProgress();const b=document.querySelector('#progressPage .complete-session');if(b){b.textContent='✓ Saved';setTimeout(()=>{if(b.isConnected)b.textContent='Save measures'},1200)}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='homePage')renderHome();if(id==='daysPage')renderDays();if(id==='progressPage')renderProgress();window.scrollTo({top:0,behavior:'smooth'})}
function updateClock(){const el=document.getElementById('clock');if(el){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}}
function toggleTimer(){timerRunning=!timerRunning;const b=document.getElementById('timerToggle');if(b)b.textContent=timerRunning?'Pause':'Start';clearInterval(timerInt);if(timerRunning)timerInt=setInterval(()=>{timerSeconds++;updateClock()},1000)}
function setTimer(sec){clearInterval(timerInt);timerSeconds=sec;timerRunning=true;updateClock();const b=document.getElementById('timerToggle');if(b)b.textContent='Pause';timerInt=setInterval(()=>{timerSeconds--;updateClock();if(timerSeconds<=0){clearInterval(timerInt);timerRunning=false;if(navigator.vibrate)navigator.vibrate([180,100,180]);const b=document.getElementById('timerToggle');if(b)b.textContent='Start'}},1000)}
function resetTimer(){clearInterval(timerInt);timerSeconds=0;timerRunning=false;updateClock();const b=document.getElementById('timerToggle');if(b)b.textContent='Start'}
document.getElementById('todayDate').textContent=formatDate();
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('quickTimer').onclick=()=>{openDay(programDay());setTimer(60)};
document.getElementById('settingsBtn').onclick=()=>{document.getElementById('startDateInput').value=settings.startDate;document.getElementById('bodyweightInput').value=settings.bodyweight;document.getElementById('heightInput').value=settings.height||'';document.getElementById('ageInput').value=settings.age||'';document.getElementById('sexInput').value=settings.sex||'';document.getElementById('stepsInput').value=settings.steps;document.getElementById('maintenanceInput').value=settings.maintenanceOverride||'';document.getElementById('settingsOverlay').classList.add('show')};
document.getElementById('cancelSettings').onclick=()=>document.getElementById('settingsOverlay').classList.remove('show');
document.getElementById('saveSettings').onclick=()=>{settings={...settings,startDate:document.getElementById('startDateInput').value||settings.startDate,bodyweight:Number(document.getElementById('bodyweightInput').value)||settings.bodyweight,height:Number(document.getElementById('heightInput').value)||0,age:Number(document.getElementById('ageInput').value)||0,sex:document.getElementById('sexInput').value||'',steps:Number(document.getElementById('stepsInput').value)||settings.steps,maintenanceOverride:Number(document.getElementById('maintenanceInput').value)||0};if(settings.bodyweight>0){measurements.weight=String(settings.bodyweight);localStorage.setItem('motion12.measurements',JSON.stringify(measurements))}localStorage.setItem('motion12.settings',JSON.stringify(settings));document.getElementById('settingsOverlay').classList.remove('show');renderHome();renderDays();renderProgress()};
renderHome();renderDays();renderProgress();
</script>
