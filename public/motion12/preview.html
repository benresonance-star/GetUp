</div>

<script>const defaultSettings={startDate:getMondayISO(new Date()),bodyweight:0,steps:7000};
let settings=JSON.parse(localStorage.getItem('motion12.settings')||'null')||defaultSettings;
let logs=JSON.parse(localStorage.getItem('motion12.logs')||'{}');
let measurements=JSON.parse(localStorage.getItem('motion12.measurements')||'{}');
let timerInt=null,timerSeconds=0,timerRunning=false;
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getMondayISO(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return iso(x)}
function todayISO(){const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekNo(){const s=new Date(settings.startDate+'T00:00:00');const t=new Date(todayISO()+'T00:00:00');return Math.max(1,Math.min(12,Math.floor((t-s)/604800000)+1))}
function programDay(){return new Date().getDay()}
function sessionKey(day=programDay()){return `${todayISO()}-${day}`}
function protein(){return settings.bodyweight>0?Math.round(settings.bodyweight*1.8):null}
function proteinPerMeal(){return protein()?Math.round(protein()/3):null}
function fatLossTargets(){if(!settings.bodyweight)return null;return {low:(settings.bodyweight*.005).toFixed(2),high:(settings.bodyweight*.008).toFixed(2),cap:(settings.bodyweight*.01).toFixed(2)}}
function nutritionSummary(){const p=protein(),pm=proteinPerMeal(),f=fatLossTargets();if(!p||!f)return 'Add bodyweight to calculate protein and weekly fat-loss targets.';return `Protein ~${p} g/day · ~${pm} g/meal across 3 meals · target loss ${f.low}–${f.high} kg/week · 1% guardrail ${f.cap} kg/week.`}
function dietText(day){const p=protein(),pm=proteinPerMeal();if(day===1)return ['FAST DAY','Train → begin fast',p?`Water, plain tea/coffee. Tomorrow resume ~${p} g protein/day (~${pm} g across 3 meals).`:'Water, plain tea/coffee. Add bodyweight to calculate your refeed protein target.'];if(day===2)return ['REFEED',p?`Break fast after recovery · ~${p} g protein today`:'Break fast after recovery',p?`Aim ~${pm} g protein at each of 3 meals; eat normally rather than compensating.`:'Protein-rich first meal. Eat normally; don’t compensate.'];return p?[`~${p} G PROTEIN`,`~${pm} g protein × 3 meals`,'Protein + plants at each meal; vegetables at lunch and dinner.']:[`SET WEIGHT`,'Protein + plants','Add bodyweight in settings to calculate a ~1.8 g/kg protein target.'];}
function formatDate(){return new Intl.DateTimeFormat('en-AU',{weekday:'short',day:'numeric',month:'short'}).format(new Date())}
function weeklyTarget(day,w){if(day===4)return swingTargets[w-1];if(day===6)return aerobicTargets[w-1];if(w===8)return 'DELOAD — reduce sets 35–40%';if(w===12)return 'CONSOLIDATE — reduce volume ~40%';if(w>=9)return '1–2 reps in reserve on final sets';if(w>=5)return '~2 reps in reserve';return w<=2?'~3 reps in reserve':'~2–3 reps in reserve'}
function completedOn(date,day){return !!logs[`${date}-${day}`]?.completed}
</script>
<script>function renderHome(){const d=programDay(),w=weekNo(),p=program[d],diet=dietText(d),fat=fatLossTargets();const start=new Date(settings.startDate+'T00:00:00');const weekStart=new Date(start);weekStart.setDate(start.getDate()+(w-1)*7);let strip='';for(let i=0;i<7;i++){const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+i);const dd=dt.getDay();const ds=iso(dt);strip+=`<button class="daydot ${dd===d&&ds===todayISO()?'today':''} ${completedOn(ds,dd)?'done':''}" onclick="openDay(${dd},'${ds}')"><b>${short[dd]}</b><span></span></button>`}
 document.getElementById('homePage').innerHTML=`
  <div class="homegrid"><div>
  <section class="hero"><div class="eyebrow">Week ${w} · Today</div><h1>${p.name}</h1><div class="sub">${p.why}</div><div class="hero-meta"><span class="pill">◷ ${p.time}</span><span class="pill">◎ ${settings.steps.toLocaleString()} steps baseline</span></div><button class="cta" onclick="openDay(${d},'${todayISO()}')"><span>${completedOn(todayISO(),d)?'Review completed session':'Start today’s session'}</span><span>→</span></button></section>
  <section class="section"><div class="section-head"><h2>This week</h2><small>Week ${w} of 12</small></div><div class="weekstrip">${strip}</div><div class="progressbar"><i style="width:${Math.round((w-1)/11*100)}%"></i></div></section>
  </div><div>
  <section class="section"><div class="section-head"><h2>Why today</h2></div><div class="card accent"><span class="tag">Training logic</span><h3 style="margin-top:12px">${p.why}</h3><p style="margin-top:8px">Today’s progression: <b class="volt">${weeklyTarget(d,w)}</b></p></div></section>
  <section class="section"><div class="section-head"><h2>Food</h2><small>bodyweight-linked</small></div><div class="diet-grid"><div class="card diet-card"><span class="tag">Today</span><div class="big ${d===1?'fast':''}">${diet[0]}</div><p>${diet[1]} · ${diet[2]}</p></div><div class="card diet-card"><span class="tag">Fat-loss target</span><div class="big">${fat?`${fat.low}–${fat.high}`:'SET WEIGHT'}</div><p>${fat?`kg/week · 1% guardrail ${fat.cap} kg/week`:'Add bodyweight in Settings or Progress.'}</p></div></div></section>
  <section class="section"><div class="section-head"><h2>Daily mobility</h2><small>6–8 min</small></div><div class="card row"><div><h3>7-move reset</h3><p>Neck · thoracic spine · shoulders · hips · lateral reach</p></div><div class="right">↗</div></div></section>
  </div></div>`;
}
function renderDays(){const d=programDay(),w=weekNo();let html=`<div class="page-title"><div class="eyebrow">Week ${w}</div><h1>Your week</h1><p>Same structure every week. Only load, leverage and aerobic output progress.</p></div><div class="section day-list cards">`;
 [1,2,3,4,5,6,0].forEach(day=>{const p=program[day];html+=`<div class="card row ${day===d?'todaycard':''}" onclick="openDay(${day})"><div><div class="label">${DAYS[day]} · ${p.time}</div><h3>${p.name}</h3><p>${weeklyTarget(day,w)}</p></div><div class="right ${p.tone}">→</div></div>`});html+='</div>';document.getElementById('daysPage').innerHTML=html;
}
function exId(day,i,date){return `${date}-${day}-${i}`}
function dateForProgramDay(day){const s=new Date(settings.startDate+'T00:00:00');const w=weekNo();const monday=new Date(s);monday.setDate(s.getDate()+(w-1)*7);const offset=day===0?6:day-1;const d=new Date(monday);d.setDate(monday.getDate()+offset);return iso(d)}
function openDay(day,date=null){date=date||dateForProgramDay(day);const w=weekNo(),p=program[day];showPage('dayPage');let exHtml='';p.work.forEach((x,i)=>{const id=exId(day,i,date);const state=logs[id]||{};let target=x[1];if(day===4)target=swingTargets[w-1];if(day===6)target=aerobicTargets[w-1];exHtml+=`<div class="exercise ${state.done?'complete':''}" id="ex-${id}"><div class="ex-top"><div class="num">${i+1}</div><div class="ex-name"><h3>${x[0]} <a class="video-link" href="${videoFor(x[0])}" target="_blank" rel="noopener noreferrer">▶ Form</a></h3><p>${target}</p></div><button class="check" onclick="toggleExercise('${id}')"></button></div>
      <div class="inputs"><div class="field"><label>Load / pace</label><input value="${state.load||''}" placeholder="e.g. 20 kg" oninput="saveEx('${id}','load',this.value)"></div><div class="field"><label>Actual</label><input value="${state.reps||''}" placeholder="sets/reps" oninput="saveEx('${id}','reps',this.value)"></div><div class="field"><label>RIR / effort</label><input value="${state.rir||''}" placeholder="2 RIR" oninput="saveEx('${id}','rir',this.value)"></div></div>
      <div class="tip">${x[2]}</div><div class="tip progress-rule"><b>Progress:</b> ${x[3]}</div></div>`});
 let mob=mobility.map((m,i)=>`<div class="card row"><div><h3>${m[0]} <a class="video-link" href="${videoFor(m[0])}" target="_blank" rel="noopener noreferrer">▶ Form</a></h3><p>${m[1]}</p></div><span class="volt">${String(i+1).padStart(2,'0')}</span></div>`).join('');
 const diet=dietText(day), key=`${date}-${day}`;
 document.getElementById('dayPage').innerHTML=`<div class="day-page-wrap"><div class="sticky-col"><button class="back" onclick="showPage('homePage')">← Home</button><div class="page-title"><div class="eyebrow">${DAYS[day]} · Week ${w}</div><h1>${p.name}</h1><p>${p.why}</p></div><div class="session-summary"><div class="mini"><b>${p.time.replace(' min','')}</b><span>minutes</span></div><div class="mini"><b>${p.work.length}</b><span>moves</span></div><div class="mini"><b>${settings.steps/1000}k</b><span>steps</span></div></div>
 <div class="timer"><div class="eyebrow">Session / rest timer</div><div class="clock" id="clock">00:00</div><div class="timer-actions"><button class="primary" onclick="toggleTimer()" id="timerToggle">Start</button><button onclick="setTimer(60)">1:00</button><button onclick="setTimer(90)">1:30</button><button onclick="resetTimer()">Reset</button></div></div>
 <div class="card accent"><span class="tag">Today’s progression</span><h3 style="margin-top:10px">${weeklyTarget(day,w)}</h3></div><div class="card" style="margin-top:10px"><span class="tag">Food</span><h3 style="margin-top:10px" class="${day===1?'fast':''}">${diet[0]}</h3><p>${diet[1]}. ${diet[2]}</p><div class="nutrition-strip">${nutritionSummary()}</div></div></div>
 <div><section class="section"><div class="section-head"><h2>Workout</h2><small>log as you go</small></div>${exHtml||'<div class="card"><h3>Recovery day</h3><p>No formal strength work. Keep normal walking and complete the mobility reset below.</p></div>'}</section>
 <section class="section"><div class="section-head"><h2>Mobility reset</h2><small>daily</small></div><div class="cards">${mob}</div></section><button class="complete-session ${logs[key]?.completed?'done':''}" onclick="completeSession('${key}')">${logs[key]?.completed?'✓ Session complete':'Complete session'}</button></div></div>`;
 updateClock(); window.scrollTo({top:0,behavior:'smooth'});
}
function toggleExercise(id){logs[id]=logs[id]||{};logs[id].done=!logs[id].done;localStorage.setItem('motion12.logs',JSON.stringify(logs));document.getElementById('ex-'+id)?.classList.toggle('complete',logs[id].done)}
function saveEx(id,k,v){logs[id]=logs[id]||{};logs[id][k]=v;localStorage.setItem('motion12.logs',JSON.stringify(logs))}
function completeSession(key){logs[key]=logs[key]||{};logs[key].completed=!logs[key].completed;localStorage.setItem('motion12.logs',JSON.stringify(logs));renderHome();renderDays();openDay(Number(key.split('-').pop()),key.slice(0,10))}
function renderProgress(){const fields=[['weight','Bodyweight','kg'],['waist','Waist','cm'],['bp','Blood pressure','mmHg'],['rhr','Resting heart rate','bpm'],['walk','2 km walk','min'],['pushups','Strict push-ups','reps']];const p=protein(),pm=proteinPerMeal(),fat=fatLossTargets();let cards=fields.map(([id,n,u])=>`<div class="card measure"><span class="tag">${u}</span><h3>${n}</h3><input id="measure-${id}" value="${measurements[id]||''}" placeholder="Enter current"></div>`).join('');document.getElementById('progressPage').innerHTML=`<div class="page-title"><div class="eyebrow">Functional age dashboard</div><h1>Progress</h1><p>Track six useful measures. Bodyweight also drives your food and fat-loss targets.</p></div><section class="section"><div class="card accent"><span class="tag">Bodyweight-driven targets</span><div class="target-grid"><div class="target-chip"><b>${p?`${p} g`:'Set weight'}</b><span>protein / day</span></div><div class="target-chip"><b>${pm?`${pm} g`:'—'}</b><span>protein / meal × 3</span></div><div class="target-chip"><b>${fat?`${fat.low}–${fat.high} kg`:'—'}</b><span>target loss / week</span></div><div class="target-chip"><b>${fat?`${fat.cap} kg`:'—'}</b><span>1% loss guardrail</span></div></div></div><div class="measure-grid" style="margin-top:10px">${cards}</div><div class="savebar"><button class="complete-session" onclick="saveMeasurements()">Save measures</button></div></section><section class="section"><div class="card accent"><h3>What success looks like</h3><p>Waist ↓ · strength ↑ · 2 km time ↓ · cardiovascular tolerance ↑ · blood pressure healthy · resting heart rate stable or ↓.</p></div><div class="card" style="margin-top:10px"><h3>Fat-loss guardrail</h3><p>${fat?`At ${settings.bodyweight} kg, the working target is about ${fat.low}–${fat.high} kg/week. If loss exceeds ~${fat.cap} kg/week for two weeks and strength, sleep or energy fall, increase food slightly.`:'Enter bodyweight above to calculate your individual weekly range.'}</p></div></section>`}
function saveMeasurements(){['weight','waist','bp','rhr','walk','pushups'].forEach(id=>measurements[id]=document.getElementById('measure-'+id).value);const w=Number(measurements.weight);if(w>0){settings.bodyweight=w;localStorage.setItem('motion12.settings',JSON.stringify(settings))}localStorage.setItem('motion12.measurements',JSON.stringify(measurements));renderHome();renderDays();renderProgress();const b=document.querySelector('#progressPage .complete-session');if(b){b.textContent='✓ Saved';setTimeout(()=>{if(b.isConnected)b.textContent='Save measures'},1200)}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='homePage')renderHome();if(id==='daysPage')renderDays();if(id==='progressPage')renderProgress();window.scrollTo({top:0,behavior:'smooth'})}
function updateClock(){const el=document.getElementById('clock');if(el){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}}
function toggleTimer(){timerRunning=!timerRunning;const b=document.getElementById('timerToggle');if(b)b.textContent=timerRunning?'Pause':'Start';clearInterval(timerInt);if(timerRunning)timerInt=setInterval(()=>{timerSeconds++;updateClock()},1000)}
function setTimer(sec){clearInterval(timerInt);timerSeconds=sec;timerRunning=true;updateClock();const b=document.getElementById('timerToggle');if(b)b.textContent='Pause';timerInt=setInterval(()=>{timerSeconds--;updateClock();if(timerSeconds<=0){clearInterval(timerInt);timerRunning=false;if(navigator.vibrate)navigator.vibrate([180,100,180]);const b=document.getElementById('timerToggle');if(b)b.textContent='Start'}},1000)}
function resetTimer(){clearInterval(timerInt);timerSeconds=0;timerRunning=false;updateClock();const b=document.getElementById('timerToggle');if(b)b.textContent='Start'}
document.getElementById('todayDate').textContent=formatDate();
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('quickTimer').onclick=()=>{openDay(programDay());setTimer(60)};
document.getElementById('settingsBtn').onclick=()=>{document.getElementById('startDateInput').value=settings.startDate;document.getElementById('bodyweightInput').value=settings.bodyweight;document.getElementById('stepsInput').value=settings.steps;document.getElementById('settingsOverlay').classList.add('show')};
document.getElementById('cancelSettings').onclick=()=>document.getElementById('settingsOverlay').classList.remove('show');
document.getElementById('saveSettings').onclick=()=>{settings={startDate:document.getElementById('startDateInput').value||settings.startDate,bodyweight:Number(document.getElementById('bodyweightInput').value)||settings.bodyweight,steps:Number(document.getElementById('stepsInput').value)||settings.steps};if(settings.bodyweight>0){measurements.weight=String(settings.bodyweight);localStorage.setItem('motion12.measurements',JSON.stringify(measurements))}localStorage.setItem('motion12.settings',JSON.stringify(settings));document.getElementById('settingsOverlay').classList.remove('show');renderHome();renderDays();renderProgress()};
renderHome();renderDays();renderProgress();
</script>
</body>
</html>
