name: Motion 12 Preview Pages

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: motion12-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/motion12
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
