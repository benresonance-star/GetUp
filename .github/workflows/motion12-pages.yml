name: Motion 12 Preview Pages

on:
  push:
    branches:
      - motion12-preview
    paths:
      - 'public/motion12/**'
      - '.github/workflows/motion12-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: motion12-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/motion12

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
