name: Motion 12 Pages

on:
  push:
    branches:
      - motion12-preview
    paths:
      - 'public/motion12/**'
      - '.github/workflows/motion12-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: motion12-pages
  cancel-in-progress: true

jobs:
  trigger-default-branch:
    if: github.ref == 'refs/heads/motion12-preview'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deployment from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run motion12-pages.yml --ref master

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOTION12 source
        uses: actions/checkout@v4
        with:
          ref: motion12-preview

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/motion12

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
